apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-deployment
  namespace: student-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-service
  template:
    metadata:
      labels:
        app: student-service
    spec:
      containers:
        - name: student-container
          image: studentmarkservice:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9900